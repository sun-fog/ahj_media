<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline</title>
  </head>
  <body>
    <div class="timeline">
      <div class="timeline__posts" id="posts"></div>

      <div class="timeline__status" id="audio-status" hidden></div>
      <button
        type="button"
        class="timeline__btn timeline__btn--cancel"
        id="audio-cancel"
        hidden
      >
        Cancel
      </button>

      <form class="timeline__form" id="form">
        <input
          class="timeline__input"
          id="input"
          placeholder="Введите текст и нажмите Enter"
          autocomplete="off"
        />
        <button type="button" class="timeline__btn" id="audio-btn" title="Записать аудио">
          🎤
        </button>
        <button type="button" class="timeline__btn" id="video-btn" title="Записать видео">
          📹
        </button>
      </form>

      <div class="notice" id="notice" hidden></div>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="modal__box">
        <p id="modal-hint">
          Не удалось получить координаты. Укажите их вручную в формате
          «широта, долгота»:
        </p>
        <input class="modal__input" id="modal-input" autocomplete="off" />
        <p class="modal__error" id="modal-error" hidden>
          Неверный формат. Пример: 51.50851, −0.12572
        </p>
        <div class="modal__actions">
          <button type="button" id="modal-cancel">Отмена</button>
          <button type="button" id="modal-ok">ОК</button>
        </div>
      </div>
    </div>

    <div class="modal" id="video-modal" hidden>
      <div class="modal__box">
        <video id="video-preview" autoplay muted playsinline></video>
        <div class="modal__actions">
          <button type="button" id="video-cancel">Отмена</button>
          <button type="button" id="video-record">Записать</button>
        </div>
      </div>
    </div>
  </body>
</html>
