<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AHJ Media</title>
  </head>
  <body>
    <div class="app">
      <div id="notice" class="notice" hidden></div>

      <div id="posts" class="posts"></div>

      <form id="form" class="timeline__form">
        <button type="button" id="mic-btn" class="timeline__btn" title="Записать аудио">🎤</button>
        <button type="button" id="video-btn" class="timeline__btn" title="Записать видео">📹</button>
        <span id="mic-timer" class="mic-timer" hidden></span>
        <button type="button" id="mic-cancel" class="timeline__btn timeline__btn--cancel" hidden>Cancel</button>
        <input id="input" class="timeline__input" placeholder="Что нового?" autocomplete="off" />
      </form>
    </div>

    <!-- Модальное окно ручного ввода координат -->
    <div id="modal" class="modal" hidden>
      <div class="modal__box">
        <p id="modal-hint" class="modal__hint"></p>
        <input id="modal-input" class="modal__input" placeholder="51.50851, -0.12572" />
        <p id="modal-error" class="modal__error" hidden>
          Введите координаты в формате «широта, долгота»
        </p>
        <div class="modal__actions">
          <button id="modal-ok" type="button" class="modal__btn">Сохранить</button>
          <button id="modal-cancel" type="button" class="modal__btn">Отмена</button>
        </div>
      </div>
    </div>

    <!-- Модальное окно записи видео -->
    <div id="video-modal" class="modal" hidden>
      <div class="modal__box">
        <video id="video-preview" class="modal__preview" muted autoplay playsinline></video>
        <div class="modal__actions">
          <button id="video-record" type="button" class="modal__btn">Записать</button>
          <button id="video-cancel" type="button" class="modal__btn">Отмена</button>
        </div>
      </div>
    </div>
  </body>
</html>
